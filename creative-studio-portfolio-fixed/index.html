<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zelalem.M</title>
<meta name="description" content="Graphic design, marketing and mural art portfolio by Zelalem.M, Addis Ababa.">
<meta name="theme-color" content="#f5eedc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Newsreader:ital,opsz,wght@0,6..72,400..500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f5eedc;--ink:#111111;--orange:#f58220;
  --plaster:var(--cream);--bone:var(--cream);--blue:var(--orange);--blue-soft:var(--orange);
  --muted:rgba(17,17,17,.68);--line:rgba(17,17,17,.2);--ph:rgba(17,17,17,.09);--tint:rgba(17,17,17,.06);
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,system-ui,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --pad:clamp(20px,5vw,72px);--max:1480px;--hdr:76px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--plaster);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.65;-webkit-font-smoothing:antialiased}
img,video,iframe{max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 6px var(--orange)}
.wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-inline:var(--pad)}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.035em;line-height:.98;text-wrap:balance}
.lede{font-size:clamp(20px,2vw,24px);line-height:1.55;max-width:34em;color:var(--ink);margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.005em;line-height:1;padding:17px 26px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--bone);transition:background .2s,color .2s,transform .2s,border-color .2s}
.btn:hover{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.btn.light{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.btn.light:hover{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.textlink{font-family:var(--display);font-weight:600;font-size:16px;border-bottom:2px solid currentColor;padding-bottom:3px}
.textlink:hover{border-bottom-color:var(--orange)}

/* admin bar (only the signed-in admin sees it) */
.adminbar{background:var(--orange);color:var(--ink);font-family:var(--display);font-size:14px;font-weight:500}
.adminbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:42px;padding-block:6px}
.adminbar a{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.adminbar .acts{display:flex;gap:22px;align-items:center}
.adminbar button{background:none;border:0;padding:0;font:inherit;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}

/* header */
.site-header{position:sticky;top:0;z-index:40;background:rgba(245,238,220,.9);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:var(--hdr)}
.brand{display:flex;align-items:center;gap:13px;font-family:var(--display);flex:none}
.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--bone);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;letter-spacing:-.04em}
.brand-mark span{color:var(--orange)}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-size:20px;font-weight:700;letter-spacing:-.03em}
.brand-text small{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:3px}
.primary-nav{display:flex;align-items:center;gap:6px}
.primary-nav a{position:relative;font-family:var(--display);font-weight:600;font-size:16px;padding:10px 16px;border-radius:999px;color:var(--ink);transition:background .2s,color .2s}
.primary-nav a:hover{background:var(--tint)}
.primary-nav a[aria-current=page]{background:var(--ink);color:var(--bone)}
.hdr-actions{display:flex;align-items:center;gap:12px;flex:none}
.hdr-actions .btn{padding:13px 22px;font-size:15px}
.admin-pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;border:2px solid var(--ink);color:var(--ink);background:transparent;transition:background .2s,color .2s}
.admin-pill i{width:9px;height:9px;border-radius:50%;background:var(--orange);display:block;box-shadow:0 0 0 2px var(--ink)}
.admin-pill:hover{background:var(--orange)}
.menu-btn{display:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:transparent;position:relative}
.menu-btn span,.menu-btn span:before{content:"";position:absolute;left:12px;right:12px;height:2px;background:var(--ink);transition:transform .25s,top .25s}
.menu-btn span{top:21px}.menu-btn span:before{left:0;right:0;top:-6px}
.menu-btn[aria-expanded=true] span{transform:rotate(45deg)}
.menu-btn[aria-expanded=true] span:before{top:0;transform:rotate(-90deg)}
.sheet{display:none}

/* page layout helpers */
.sec{padding-block:clamp(64px,9vw,128px)}
.sec.tight{padding-top:0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,52px)}
.sec-head h2{font-size:clamp(40px,6.2vw,92px)}
.sec-head p{margin:0;max-width:26em;color:var(--muted)}

/* hero */
.hero{padding-block:clamp(40px,6vw,88px) clamp(56px,8vw,112px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:clamp(28px,5vw,80px);align-items:end}
.hero h1{font-size:clamp(56px,10.4vw,164px);line-height:.9;letter-spacing:-.055em;font-weight:800}
.hero .lede{margin-top:clamp(24px,3vw,40px)}
.hero .btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:clamp(24px,3vw,36px)}
.paint{position:relative;aspect-ratio:4/5;background:var(--ph);overflow:hidden;border-radius:6px}
.paint img{width:100%;height:100%;object-fit:cover;display:block}
.paint:after{content:"";position:absolute;inset:0;background:var(--blue);transform-origin:100% 50%;animation:roll 1.25s cubic-bezier(.77,0,.18,1) .25s both}
@keyframes roll{to{transform:scaleX(0)}}

/* statement band */
.statement{background:var(--ink);color:var(--bone);padding-block:clamp(48px,7vw,96px)}
.statement p{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(34px,6.4vw,100px);line-height:1;letter-spacing:-.045em;max-width:15em}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(32px,3.4vw,52px) clamp(16px,2vw,28px)}
.tile{display:block;min-width:0}
.tile-media{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--ph);border-radius:6px;display:block;width:100%;border:0;padding:0}
.tile-media img,.tile-media video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile:hover .tile-media img,.tile:hover .tile-media video{transform:scale(1.04)}
.tile-meta{padding-top:14px}
.tile-meta h3{font-size:clamp(21px,1.9vw,27px);line-height:1.1;letter-spacing:-.02em;font-weight:650}
.tile-meta h3 a,.tile-meta h3 button{background:linear-gradient(var(--blue),var(--blue)) 0 100%/0 2px no-repeat;transition:background-size .3s}
.tile:hover .tile-meta h3 a,.tile:hover .tile-meta h3 button{background-size:100% 2px}
.tile-meta p{margin:6px 0 0;color:var(--muted);font-size:16px;line-height:1.45}
.tile-meta h3 button{border:0;background-color:transparent;padding:0;text-align:left;font:inherit;letter-spacing:inherit}
.kind{display:inline-block;font-family:var(--display);font-size:13.5px;font-weight:600;margin-bottom:6px}
.play{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:var(--bone);color:var(--ink);display:grid;place-items:center;transition:transform .25s,background .25s,color .25s;box-shadow:0 6px 30px rgba(17,17,17,.25)}
.play svg{width:26px;height:26px;margin-left:4px}
.tile:hover .play{transform:scale(1.1);background:var(--orange);color:var(--ink)}
.vbadge{position:absolute;left:12px;top:12px;font-family:var(--display);font-weight:700;font-size:13px;background:var(--ink);color:var(--bone);padding:6px 11px;border-radius:999px}
.empty{padding:40px;background:var(--tint);border-radius:6px;color:var(--muted)}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 clamp(28px,4vw,48px)}
.chip{font-family:var(--display);font-weight:600;font-size:16px;padding:11px 20px;border-radius:999px;border:2px solid var(--ink);background:transparent;transition:background .2s,color .2s}
.chip:hover{background:var(--orange)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bone)}

/* services */
.svc{border-top:2px solid var(--ink)}
.svc a,.svc div.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(16px,4vw,64px);padding-block:clamp(24px,3vw,40px);border-bottom:1px solid var(--line);align-items:baseline;transition:padding .25s,background .25s}
.svc a:hover{padding-left:16px}
.svc h3{font-size:clamp(32px,4.6vw,66px);letter-spacing:-.04em}
.svc p{margin:0;color:var(--muted);max-width:30em}
.svc a:hover h3{box-shadow:inset 0 -.16em 0 var(--orange)}

/* cta */
.cta-band{background:var(--orange);color:var(--ink);padding-block:clamp(64px,9vw,128px)}
.cta-band h2{font-size:clamp(46px,8.6vw,136px);letter-spacing:-.055em;line-height:.92;font-weight:800;max-width:11em}
.cta-band .btn{margin-top:clamp(28px,4vw,48px)}

/* page tops */
.page-top{padding-block:clamp(48px,7vw,104px) clamp(28px,4vw,56px)}
.page-top h1{font-size:clamp(52px,9vw,140px);line-height:.92;letter-spacing:-.05em;font-weight:800;max-width:12em}
.page-top .lede{margin-top:clamp(20px,2.4vw,32px);color:var(--muted)}

/* about */
.about-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,6vw,96px);align-items:start}
.about-grid img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--ph);border-radius:6px}
.about-grid h2{font-size:clamp(34px,4.4vw,64px);margin-bottom:24px}
.about-grid p{margin:0;max-width:32em}

/* contact */
.contact-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,7vw,110px);align-items:start}
.info p{margin:0 0 24px;font-size:20px}
.info b{display:block;font-family:var(--display);font-size:15px;font-weight:600;color:var(--muted);margin-bottom:2px}
.info a{border-bottom:2px solid var(--orange)}
form.cform{display:grid;gap:18px}
.fld{display:block}
.fld span{display:block;font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:8px}
.fld input,.fld textarea{width:100%;font:inherit;font-size:19px;padding:15px 16px;background:var(--tint);border:2px solid transparent;border-bottom-color:var(--ink);border-radius:6px 6px 0 0;color:var(--ink);transition:border-color .2s,background .2s}
.fld textarea{min-height:170px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--orange);border-bottom-color:var(--ink);background:var(--cream);box-shadow:0 0 0 3px var(--orange)}
.hp{position:absolute!important;left:-9999px;height:0;width:0;opacity:0}
.notice{margin:0;font-family:var(--display);font-weight:600;font-size:16px;min-height:1.4em}
.notice.ok,.notice.err{color:var(--ink)}.notice.ok:before{content:'✓ '}.notice.err:before{content:'! '}

/* project detail */
.d-top{padding-block:clamp(32px,5vw,64px) clamp(24px,3vw,40px)}
.d-top h1{font-size:clamp(46px,8.4vw,128px);line-height:.93;letter-spacing:-.05em;font-weight:800;margin:clamp(20px,3vw,36px) 0 clamp(16px,2vw,24px);max-width:13em}
.d-top .lede{color:var(--muted)}
.d-hero img{width:100%;max-height:78vh;object-fit:cover;display:block;background:var(--ph);border-radius:6px}
.d-video{margin-top:clamp(20px,3vw,40px)}
.d-body{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(28px,6vw,96px);padding-block:clamp(48px,7vw,104px)}
.facts{margin:0}
.facts div{padding:16px 0;border-bottom:1px solid var(--line)}
.facts div:first-child{border-top:2px solid var(--ink)}
.facts dt{font-family:var(--display);font-size:14px;font-weight:600;color:var(--muted)}
.facts dd{margin:4px 0 0;font-size:20px}
.d-text h2{font-size:clamp(28px,3.4vw,48px);line-height:1.04;margin-bottom:22px;max-width:18em}
.d-text p{margin:0 0 32px;max-width:32em}
.d-nav{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.d-nav a{padding:clamp(24px,4vw,48px) var(--pad);display:flex;flex-direction:column;gap:8px;transition:background .25s,color .25s}
.d-nav a:last-child{text-align:right;border-left:1px solid var(--line)}
.d-nav a:hover{background:var(--ink);color:var(--bone)}
.d-nav small{font-family:var(--display);font-size:14px;font-weight:600;opacity:.7}
.d-nav b{font-family:var(--display);font-size:clamp(22px,3.2vw,44px);letter-spacing:-.03em;line-height:1.05}

/* video frame (detail + lightbox) */
.vframe{position:relative;aspect-ratio:16/9;background:var(--ink);border-radius:6px;overflow:hidden}
.vframe iframe,.vframe video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--ink)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(17,17,17,.94);display:none;align-items:center;justify-content:center;padding:clamp(16px,4vw,56px)}
.lb.on{display:flex;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.lb-box{width:min(1180px,100%)}
.lb-cap{color:var(--cream);font-family:var(--display);font-weight:600;font-size:20px;margin-top:14px}
.lb-close{position:absolute;top:16px;right:16px;width:48px;height:48px;border-radius:50%;border:2px solid var(--cream);background:transparent;color:var(--cream);font-size:26px;line-height:1}
.lb-close:hover{background:var(--orange);border-color:var(--orange);color:var(--ink)}

/* footer */
.site-footer{background:var(--ink);color:var(--bone);padding-block:clamp(56px,8vw,104px) 32px}
.f-big{font-family:var(--display);font-weight:800;font-size:clamp(56px,15vw,240px);line-height:.85;letter-spacing:-.06em;margin:0 0 clamp(36px,5vw,72px);overflow-wrap:anywhere}
.f-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;border-top:1px solid rgba(245,238,220,.25);padding-top:32px;font-size:17px;line-height:1.7}
.f-cols h4{font-family:var(--display);font-size:15px;font-weight:600;color:var(--blue-soft);margin:0 0 10px;letter-spacing:0}
.f-cols a:hover{color:var(--blue-soft)}
.f-cols a{display:block;width:fit-content}
.f-base{margin-top:48px;font-family:var(--display);font-size:14px;color:rgba(245,238,220,.65)}

/* responsive */
@media(max-width:1020px){
  .primary-nav,.hdr-actions .btn,.hdr-actions .admin-pill{display:none}
  .menu-btn{display:block}
  .sheet{position:fixed;inset:0;top:0;z-index:60;background:var(--plaster);padding:calc(var(--hdr) + 12px) var(--pad) 40px;overflow:auto;transform:translateY(-102%);visibility:hidden;transition:transform .45s cubic-bezier(.7,0,.2,1),visibility 0s .45s;display:flex;flex-direction:column;gap:4px}
  .sheet.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.7,0,.2,1)}
  .sheet a.nl{font-family:var(--display);font-weight:700;font-size:clamp(40px,11vw,64px);letter-spacing:-.04em;line-height:1.15;padding:6px 0;border-bottom:1px solid var(--line)}
  .sheet a.nl[aria-current=page]{box-shadow:inset 0 -.2em 0 var(--orange)}
  .sheet .btn{margin-top:28px;align-self:flex-start}
  .sheet .admin-pill{margin-top:14px;align-self:flex-start}
  .site-header{z-index:70}
  .hero-grid{grid-template-columns:1fr}
  .paint{aspect-ratio:4/3}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .about-grid,.contact-grid,.d-body{grid-template-columns:1fr}
  .svc a,.svc div.row{grid-template-columns:1fr;gap:10px}
  .f-cols{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
  body{font-size:18px}
  .tiles{grid-template-columns:1fr}
  .tile-media{aspect-ratio:4/3}
  .brand-text small{display:none}
  .f-cols{grid-template-columns:1fr}
  .adminbar .wrap{flex-direction:column;align-items:flex-start;gap:2px}
  .play{width:64px;height:64px;margin:-32px 0 0 -32px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .paint:after{animation:none;transform:scaleX(0)}
  *{transition-duration:.01ms!important}
  .lb.on{animation:none}
}
#hdr{display:contents}

</style>
</head>

      { id: 'p1', slug: 'a-new-visual-language', title: 'A New Visual Language', category: 'Graphic Design', image: U + 'photo-1541701494587-cb58502866ab?w=1000', desc: 'A bold visual identity built to stand apart.', summary: 'A growing local brand needed to look as confident as it sounded.', body: 'We built a flexible identity system: logo, colour palette, typography and layout rules that work from business cards to billboards.', year: '2025', type: 'Brand identity', services: 'Logo design · Colour system · Typography · Brand guidelines', videoUrl: '', visible: true },
      { id: 'p2', slug: 'culture-in-motion', title: 'Culture in Motion', category: 'Marketing', image: U + 'photo-1531058020387-3be344556be6?w=1000', desc: 'A campaign connecting people, place and ideas.', summary: 'A campaign to bring people, place and ideas together.', body: 'We developed the concept, the content plan and the visuals, then adapted them for social media, print and in-person events.', year: '2025', type: 'Campaign', services: 'Campaign concept · Content direction · Social media · Print', videoUrl: '', visible: true },
      { id: 'p3', slug: 'walls-that-speak', title: 'Walls That Speak', category: 'Mural Art', image: U + 'photo-1549490349-8643362247b5?w=1000', desc: 'Public art that brings colour and energy to a space.', summary: 'A blank wall became a landmark for the neighbourhood.', body: 'Working with the community, we designed and painted a large-scale mural that reflects the stories of the people who live nearby.', year: '2024', type: 'Public mural', services: 'Mural design · Wall painting · Community workshops', videoUrl: '', visible: true },
      { id: 'p4', slug: 'colour-studies', title: 'Colour Studies', category: 'Graphic Design', image: U + 'photo-1541961017774-22349e4a1262?w=1000', desc: 'An exploration of colour, shape and typography.', summary: 'An open exploration of colour, shape and typography.', body: 'A series of visual experiments that test how far colour and form can carry a message before words are needed.', year: '2024', type: 'Personal project', services: 'Art direction · Illustration · Typography', videoUrl: '', visible: true },

    services: [
      { id: 's1', num: '01', tag: 'DESIGN', title: 'Graphic design', text: 'Visual identities, print, digital design, art direction and brand systems.', link: '#/graphic-design', visible: true },

    // Which pages appear in the top menu.
    nav: { about: true, services: true, works: true, contact: true },

  // Fields shown in the admin "Site text" tab: [key, label, type]
  window.SCHEMA = [
    ['Brand & header', [
      ['brandName', 'Brand name', 'text'], ['mark', 'Logo letters (2)', 'text'], ['tagline', 'Small text under the name', 'text']]],
    ['Home — top', [
      ['heroLine1', 'Headline, line 1', 'text'], ['heroLine2', 'Headline, line 2', 'text'],
      ['heroText', 'Intro paragraph', 'area'], ['heroImage', 'Top image', 'image']]],
    ['Home — statement band', [
      ['band1a', 'Word 1', 'text'], ['band1b', 'Word 1 ending', 'text'], ['band2a', 'Word 2', 'text'], ['band2b', 'Word 2 ending', 'text'],
      ['band3a', 'Word 3', 'text'], ['band3b', 'Word 3 ending', 'text']]],
    ['Home — sections', [
      ['workLine1', 'Selected work: title line 1', 'text'], ['workLine2', 'Selected work: title line 2', 'text'], ['workText', 'Selected work: paragraph', 'area'],
      ['servicesLine1', 'Services: title line 1', 'text'], ['servicesLine2', 'Services: title line 2', 'text'],
      ['ctaLine1', 'Contact block: line 1', 'text'], ['ctaLine2', 'Contact block: line 2', 'text'], ['ctaButton', 'Contact block: button', 'text']]],
    ['About page', [
      ['aboutLine1', 'Title line 1', 'text'], ['aboutLine2', 'Title line 2', 'text'], ['aboutIntro', 'Intro', 'area'],
      ['aboutImage', 'Photo', 'image'], ['aboutHeading1', 'Heading line 1', 'text'], ['aboutHeading2', 'Heading line 2', 'text'], ['aboutText', 'Main text', 'area']]],
    ['Services page', [
      ['servicesPageLine1', 'Title line 1', 'text'], ['servicesPageLine2', 'Title line 2', 'text'], ['servicesPageText', 'Intro', 'area']]],
    ['Work page', [
      ['worksLine1', 'Title line 1', 'text'], ['worksLine2', 'Title line 2', 'text'], ['worksText', 'Intro', 'area']]],
    ['Contact page & footer', [
      ['contactLine1', 'Title line 1', 'text'], ['contactLine2', 'Title line 2', 'text'], ['contactText', 'Intro', 'area'],
      ['email', 'Email', 'text'], ['phone', 'Phone (optional)', 'text'], ['location', 'Location', 'text'],
      ['instagram', 'Instagram link (optional)', 'text'], ['linkedin', 'LinkedIn link (optional)', 'text'], ['footerNote', 'Footer note', 'text']]],
  ];

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Only allow normal web links and our own uploads in src/href attributes.
  const safeUrl = (u) => {
    u = String(u || '').trim();
    return /^(https?:\/\/|\/media\/|mailto:|#\/|tel:)/i.test(u) ? u : '';
  };
  const slugify = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'project';

  // Turn a pasted video link into something we can show.
  function videoInfo(url) {
    url = String(url || '').trim();
    let m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/i);
    if (m) return { kind: 'embed', src: 'https://www.youtube-nocookie.com/embed/' + m[1], thumb: 'https://img.youtube.com/vi/' + m[1] + '/hqdefault.jpg' };
    m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
    if (m) return { kind: 'embed', src: 'https://player.vimeo.com/video/' + m[1], thumb: '' };
    if (safeUrl(url) && /^https?:|^\/media\//i.test(url)) return { kind: 'file', src: url, thumb: '' };
    return { kind: 'none', src: '', thumb: '' };
  }

  // Merge saved content over the defaults so new fields never break an older save.
  function withDefaults(c) {
    const d = JSON.parse(JSON.stringify(window.DEFAULTS));
    if (!c) return d;
    return {
      site: Object.assign(d.site, c.site || {}),
      projects: Array.isArray(c.projects) ? c.projects : d.projects,
      videos: Array.isArray(c.videos) ? c.videos : d.videos,
      services: Array.isArray(c.services) ? c.services : d.services,
      nav: Object.assign(d.nav, c.nav || {}),
    };
  }

  window.Util = { esc, safeUrl, slugify, videoInfo, withDefaults };
})();

<script>/* Public website. Content comes from /api/content (edited in /admin), with built-in defaults as fallback. */
(function () {
  const { esc, safeUrl, videoInfo, withDefaults } = window.Util;
  let D = withDefaults(null);
  let isAdmin = false;

  const two = (a, b) => esc(a) + (b ? '<br>' + esc(b) : '');
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';

  const NAV = () => [['Home', '/', true], ['About', '/about', D.nav.about !== false], ['Services', '/services', D.nav.services !== false],
    ['Work', '/works', D.nav.works !== false], ['Contact', '/contact', D.nav.contact !== false]].filter((x) => x[2]);

  const playable = () => D.videos.filter((v) => videoInfo(v.url).kind !== 'none');

  function brand() {
    const s = D.site, mark = String(s.mark || '');
    return `<a class="brand" href="#/" aria-label="${esc(s.brandName)} — home"><span class="brand-mark">${esc(mark.slice(0, 1))}<span>${esc(mark.slice(1))}</span></span><span class="brand-text"><b>${esc(s.brandName)}</b>${s.tagline ? `<small>${esc(s.tagline)}</small>` : ''}</span></a>`;
  }

  /* ---------- tiles ---------- */
  function projectTile(p) {
    const href = '#/work/' + esc(p.slug || p.id);
    return `<article class="tile"><a class="tile-media" href="${href}" aria-label="${esc(p.title)}">${p.image ? `<img src="${esc(safeUrl(p.image))}" alt="" loading="lazy">` : ''}</a><div class="tile-meta"><h3><a href="${href}">${esc(p.title)}</a></h3><p>${esc(p.category)}</p></div></article>`;
  }
  function videoTile(v) {
    const info = videoInfo(v.url);
    const poster = safeUrl(v.poster) || info.thumb;
    const media = poster ? `<img src="${esc(poster)}" alt="" loading="lazy">` : `<video src="${esc(info.src)}#t=0.8" preload="metadata" muted playsinline tabindex="-1"></video>`;
    return `<article class="tile"><button class="tile-media" data-play="${esc(v.id)}" aria-label="Play video: ${esc(v.title)}">${media}<span class="vbadge">Video</span><span class="play">${PLAY}</span></button><div class="tile-meta"><h3><button data-play="${esc(v.id)}">${esc(v.title)}</button></h3>${v.description ? `<p>${esc(v.description)}</p>` : `<p>${esc(v.category || 'Video')}</p>`}</div></article>`;
  }

  /* ---------- lightbox ---------- */
  let lb;
  function buildLightbox() {
    lb = document.createElement('div');
    lb.className = 'lb'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.setAttribute('aria-label', 'Video player');
    lb.innerHTML = '<button class="lb-close" aria-label="Close video">×</button><div class="lb-box"><div class="vframe" id="lbframe"></div><div class="lb-cap" id="lbcap"></div></div>';
    document.body.appendChild(lb);
    lb.addEventListener('click', (e) => { if (e.target === lb || e.target.classList.contains('lb-close')) closeLb(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lb.classList.contains('on')) closeLb(); });
  }
  let lastFocus;
  function openLb(id) {
    const v = D.videos.find((x) => x.id === id); if (!v) return;
    const info = videoInfo(v.url); if (info.kind === 'none') return;
    lastFocus = document.activeElement;
    const f = document.getElementById('lbframe');
    f.innerHTML = info.kind === 'embed'
      ? `<iframe src="${esc(info.src)}?autoplay=1&rel=0" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`
      : `<video src="${esc(info.src)}" controls autoplay playsinline></video>`;
    document.getElementById('lbcap').textContent = v.title;
    lb.classList.add('on'); document.body.style.overflow = 'hidden';
    lb.querySelector('.lb-close').focus();
  }
  function closeLb() {
    lb.classList.remove('on'); document.getElementById('lbframe').innerHTML = ''; document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function videoFrame(url, title) {
    const info = videoInfo(url);
    if (info.kind === 'embed') return `<div class="vframe"><iframe src="${esc(info.src)}" title="${esc(title)}" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
    if (info.kind === 'file') return `<div class="vframe"><video src="${esc(info.src)}" controls preload="metadata" playsinline></video></div>`;
    return '';
  }

  /* ---------- pages ---------- */
  function home() {
    const s = D.site, vids = playable();
    const picks = vids.length ? [...D.projects.slice(0, 2).map(projectTile), videoTile(vids[0])] : D.projects.slice(0, 3).map(projectTile);
    return `<section class="hero"><div class="wrap hero-grid"><div><h1>${two(s.heroLine1, s.heroLine2)}</h1><p class="lede">${esc(s.heroText)}</p><div class="btns"><a class="btn" href="#/works">See the work</a><a class="btn ghost" href="#/contact">Start a project</a></div></div><div class="paint">${s.heroImage ? `<img src="${esc(safeUrl(s.heroImage))}" alt="">` : ''}</div></div></section>
<section class="statement"><div class="wrap"><p>${esc(s.band1a)} ${esc(s.band1b)} ${esc(s.band2a)} ${esc(s.band2b)} ${esc(s.band3a)} ${esc(s.band3b)}</p></div></section>
<section class="sec"><div class="wrap"><div class="sec-head"><h2>${two(s.workLine1, s.workLine2)}</h2><p>${esc(s.workText)} <a class="textlink" href="#/works">All work</a></p></div>${picks.length ? `<div class="tiles">${picks.join('')}</div>` : '<div class="empty">Projects will appear here.</div>'}</div></section>
<section class="sec tight"><div class="wrap"><div class="sec-head"><h2>${two(s.servicesLine1, s.servicesLine2)}</h2></div><div class="svc">${D.services.map((x) => `<a href="${esc(safeUrl(x.link) || '#/services')}"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></a>`).join('')}</div></div></section>
<section class="cta-band"><div class="wrap"><h2>${two(s.ctaLine1, s.ctaLine2)}</h2><a class="btn light" href="#/contact">${esc(s.ctaButton)}</a></div></section>`;
  }

  function about() {
    const s = D.site;
    return `<section class="page-top"><div class="wrap"><h1>${two(s.aboutLine1, s.aboutLine2)}</h1><p class="lede">${esc(s.aboutIntro)}</p></div></section>
<section class="sec tight"><div class="wrap about-grid">${s.aboutImage ? `<img src="${esc(safeUrl(s.aboutImage))}" alt="">` : '<div></div>'}<div><h2>${two(s.aboutHeading1, s.aboutHeading2)}</h2><p>${esc(s.aboutText)}</p></div></div></section>`;
  }

  function services() {
    const s = D.site;
    return `<section class="page-top"><div class="wrap"><h1>${two(s.servicesPageLine1, s.servicesPageLine2)}</h1><p class="lede">${esc(s.servicesPageText)}</p></div></section>
<section class="sec tight"><div class="wrap"><div class="svc">${D.services.map((x) => `<div class="row"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join('')}</div></div></section>`;
  }

  function filterList() {
    const cats = [];
    D.projects.concat(playable()).forEach((x) => { if (x.category && !cats.includes(x.category)) cats.push(x.category); });
    return [['all', 'All']].concat(cats.map((c) => [c, c]));
  }
  function itemsFor(f) {
    const vids = playable();
    if (f === 'all') return D.projects.map(projectTile).concat(vids.map(videoTile));
    return D.projects.filter((p) => p.category === f).map(projectTile).concat(vids.filter((v) => v.category === f).map(videoTile));
  }
  function tilesHtml(f) {
    const items = itemsFor(f);
    return items.length ? items.join('') : '<div class="empty" style="grid-column:1/-1">Nothing here yet.</div>';
  }
  function works(filter) {
    const s = D.site;
    const fl = filterList();
    if (!fl.some((x) => x[0] === filter)) filter = 'all';
    return `<section class="page-top"><div class="wrap"><h1>${two(s.worksLine1, s.worksLine2)}</h1><p class="lede">${esc(s.worksText)}</p></div></section>
<section class="sec tight"><div class="wrap"><div class="filters" role="group" aria-label="Filter work">${fl.map(([k, l]) => `<button class="chip" data-filter="${esc(k)}" aria-pressed="${k === filter}">${esc(l)}</button>`).join('')}</div><div class="tiles" id="tiles">${tilesHtml(filter)}</div></div></section>`;
  }

  function detail(path) {
    const key = decodeURIComponent(path.slice(6));
    const list = D.projects;
    const i = list.findIndex((p) => (p.slug || p.id) === key || p.id === key);
    if (i < 0) return `<section class="page-top"><div class="wrap"><h1>Project not found</h1><p class="lede">It may have been moved or hidden.</p><p><a class="btn" href="#/works">Back to work</a></p></div></section>`;
    const p = list[i], prev = list[(i + list.length - 1) % list.length], next = list[(i + 1) % list.length];
    document.title = p.title + ' — ' + D.site.brandName;
    const big = safeUrl(p.image).replace('w=1000', 'w=1800');
    const vf = videoFrame(p.videoUrl, p.title);
    return `<section class="d-top"><div class="wrap"><a class="textlink" href="#/works">All work</a><h1>${esc(p.title)}</h1><p class="lede">${esc(p.summary)}</p></div></section>
<div class="wrap d-hero">${p.image ? `<img src="${esc(big)}" alt="${esc(p.title)}" onerror="this.onerror=null;this.src='${esc(safeUrl(p.image))}'">` : ''}</div>
${vf ? `<div class="wrap d-video">${vf}</div>` : ''}
<section class="wrap d-body"><dl class="facts"><div><dt>Year</dt><dd>${esc(p.year)}</dd></div><div><dt>Category</dt><dd>${esc(p.category)}</dd></div>${p.type ? `<div><dt>Type</dt><dd>${esc(p.type)}</dd></div>` : ''}${p.services ? `<div><dt>What we did</dt><dd>${esc(p.services)}</dd></div>` : ''}</dl><div class="d-text"><h2>${esc(p.desc)}</h2><p>${esc(p.body)}</p><a class="btn" href="#/contact">Start a similar project</a></div></section>
${list.length > 1 ? `<nav class="d-nav" aria-label="More projects"><a href="#/work/${esc(prev.slug || prev.id)}"><small>Previous</small><b>${esc(prev.title)}</b></a><a href="#/work/${esc(next.slug || next.id)}"><small>Next</small><b>${esc(next.title)}</b></a></nav>` : ''}`;
  }

  function contact() {
    const s = D.site;
    return `<section class="page-top"><div class="wrap"><h1>${two(s.contactLine1, s.contactLine2)}</h1><p class="lede">${esc(s.contactText)}</p></div></section>
<section class="sec tight"><div class="wrap contact-grid"><div class="info"><p><b>Location</b>${esc(s.location)}</p>${s.email ? `<p><b>Email</b><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></p>` : ''}${s.phone ? `<p><b>Phone</b>${esc(s.phone)}</p>` : ''}</div>
<form class="cform" id="cform"><label class="fld"><span>Your name</span><input name="name" required maxlength="120" autocomplete="name"></label><label class="fld"><span>Email address</span><input name="email" type="email" required maxlength="160" autocomplete="email"></label><label class="fld"><span>What is it about?</span><input name="subject" maxlength="200"></label><input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true"><label class="fld"><span>Tell us about your project</span><textarea name="message" required maxlength="4000"></textarea></label><div><button class="btn" type="submit">Send message</button></div><p class="notice" id="formnotice" role="status"></p></form></div></section>`;
  }

  function footer() {
    const s = D.site;
    const soc = [['Instagram', s.instagram], ['LinkedIn', s.linkedin]].filter((l) => l[1] && safeUrl(l[1]));
    return `<div class="wrap"><p class="f-big">${esc(s.brandName)}</p><div class="f-cols"><div><h4>Say hello</h4>${s.email ? `<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>` : ''}${s.phone ? `<span>${esc(s.phone)}</span><br>` : ''}<span>${esc(s.location)}</span></div><div><h4>Pages</h4>${NAV().map(([n, p]) => `<a href="#${p}">${n}</a>`).join('')}</div><div>${soc.length ? `<h4>Elsewhere</h4>${soc.map((l) => `<a href="${esc(l[1])}" target="_blank" rel="noopener">${l[0]}</a>`).join('')}` : `<h4>Studio</h4><span>${esc(s.footerNote)}</span>`}</div></div><p class="f-base">© ${new Date().getFullYear()} ${esc(s.brandName)}${soc.length && s.footerNote ? '. ' + esc(s.footerNote) : ''}</p></div>`;
  }

  /* ---------- shell ---------- */
  function header(path) {
    const cur = (p) => (path === p || (p === '/works' && path.startsWith('/work/')) ? ' aria-current="page"' : '');
    const links = NAV();
    return `${isAdmin ? `<div class="adminbar"><div class="wrap"><span>You are signed in as admin. Edit anything from the dashboard.</span><span class="acts"><a href="/admin">Open dashboard</a><button id="adm-out">Sign out</button></span></div></div>` : ''}
<div class="site-header"><div class="wrap hdr-in">${brand()}<nav class="primary-nav" aria-label="Main">${links.map(([n, p]) => `<a href="#${p}"${cur(p)}>${n}</a>`).join('')}</nav><div class="hdr-actions">${isAdmin ? '<a class="admin-pill" href="/admin"><i></i>Admin</a>' : ''}<a class="btn" href="#/contact">Start a project</a><button class="menu-btn" id="menu" aria-label="Menu" aria-expanded="false" aria-controls="sheet"><span></span></button></div></div></div>
<div class="sheet" id="sheet">${links.map(([n, p]) => `<a class="nl" href="#${p}"${cur(p)}>${n}</a>`).join('')}<a class="btn" href="#/contact">Start a project</a>${isAdmin ? '<a class="admin-pill" href="/admin"><i></i>Admin dashboard</a>' : ''}</div>`;
  }
  function setMenu(on) {
    const b = document.getElementById('menu'), sh = document.getElementById('sheet'); if (!b) return;
    b.setAttribute('aria-expanded', on); sh.classList.toggle('open', on); document.body.style.overflow = on ? 'hidden' : '';
  }

  function wireContact() {
    const f = document.getElementById('cform'); if (!f) return;
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const note = document.getElementById('formnotice'), btn = f.querySelector('button');
      const data = Object.fromEntries(new FormData(f).entries());
      btn.disabled = true; note.className = 'notice'; note.textContent = 'Sending…';
      try {
        const r = await fetch('/api/contact', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'failed');
        f.reset(); note.className = 'notice ok'; note.textContent = 'Message sent. Thank you, we will reply by email.';
      } catch (err) {
        const em = D.site.email;
        if (em && location.protocol === 'file:') {
          location.href = 'mailto:' + em + '?subject=' + encodeURIComponent(data.subject || '') + '&body=' + encodeURIComponent((data.message || '') + '\n\nFrom: ' + data.name + ' (' + data.email + ')');
        } else { note.className = 'notice err'; note.textContent = err.message && err.message !== 'failed' ? err.message : 'The message could not be sent. Please email us directly.'; }
      }
      btn.disabled = false;
    });
  }

  function wireWorks() {
    document.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach((x) => x.setAttribute('aria-pressed', x === b));
      document.getElementById('tiles').innerHTML = tilesHtml(k);
      history.replaceState(null, '', '#/works' + (k === 'all' ? '' : '?cat=' + encodeURIComponent(k)));
    }));
  }

  function route() {
    let h = location.hash.replace(/^#/, '') || '/';
    let q = ''; const qi = h.indexOf('?');
    if (qi >= 0) { q = h.slice(qi + 1); h = h.slice(0, qi); }
    const cat = new URLSearchParams(q).get('cat') || 'all';
    // old links
    const legacy = { '/graphic-design': 'Graphic Design', '/marketing': 'Marketing', '/mural-art': 'Mural Art', '/videos': 'all' };
    if (legacy[h]) return { path: '/works', filter: legacy[h] };
    return { path: h, filter: cat };
  }

  function render() {
    const { path, filter } = route();
    document.title = D.site.brandName + ' — ' + (D.site.tagline || 'Portfolio');
    let html;
    if (path === '/') html = home();
    else if (path === '/about') html = about();
    else if (path === '/services') html = services();
    else if (path === '/works') html = works(filter);
    else if (path.startsWith('/work/')) html = detail(path);
    else if (path === '/contact') html = contact();
    else html = `<section class="page-top"><div class="wrap"><h1>Page not found</h1><p class="lede">That page does not exist.</p><p><a class="btn" href="#/">Back home</a></p></div></section>`;

    document.getElementById('hdr').innerHTML = header(path);
    document.getElementById('app').innerHTML = html;
    document.getElementById('ftr').innerHTML = footer();
    document.body.style.overflow = '';
    const mb = document.getElementById('menu'); if (mb) mb.onclick = () => setMenu(mb.getAttribute('aria-expanded') !== 'true');
    document.querySelectorAll('#sheet a').forEach((a) => a.addEventListener('click', () => setMenu(false)));
    const out = document.getElementById('adm-out');
    if (out) out.onclick = async () => { try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {} isAdmin = false; render(); };
    wireContact(); wireWorks();
    window.scrollTo(0, 0);
  }

  async function boot() {
    buildLightbox();
    document.addEventListener('click', (e) => { const b = e.target.closest('[data-play]'); if (b) { e.preventDefault(); openLb(b.dataset.play); } });
    if (location.protocol !== 'file:') {
      const get = async (u) => { const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000); try { const r = await fetch(u, { signal: ctl.signal, cache: 'no-store', credentials: 'same-origin' }); return r.ok ? await r.json() : null; } catch (e) { return null; } finally { clearTimeout(t); } };
      const [c, s] = await Promise.all([get('/api/content'), get('/api/session')]);
      if (c) D = withDefaults(c.content);
      isAdmin = Boolean(s && s.admin);
    }
    window.addEventListener('hashchange', render);
    render();
  }
  boot();
})();
</script>
</body>
</html>
