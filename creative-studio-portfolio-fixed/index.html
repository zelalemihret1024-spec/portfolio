<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORM & FIRE — Creative Studio</title>
<meta name="description" content="An independent creative studio for graphic design, marketing and mural art.">
<style>
:root{--ink:#111;--cream:#f5eedc;--orange:#f58220;--muted:#777;--line:rgba(17,17,17,.18)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.header{min-height:82px;padding:18px 5.5%;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(245,238,220,.96);z-index:10}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.04em;font-size:15px;white-space:nowrap}.brand i{color:var(--orange);font-style:normal}.brand small{display:block;font-size:8px;letter-spacing:.25em;margin-top:4px}.brand-mark{font-size:27px;line-height:1;border:2px solid var(--ink);padding:7px 8px}.brand-mark span{color:var(--orange)}nav{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}nav a{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:8px 0;border-bottom:2px solid transparent}nav a.active,nav a:hover{border-color:var(--orange)}.cta,.btn{display:inline-flex;align-items:center;gap:12px;padding:14px 19px;background:var(--orange);color:#111;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;border:0}.cta:hover,.btn:hover{transform:translateY(-2px)}.menu{display:none;background:none;border:0;font-size:25px}.hero{display:grid;grid-template-columns:1fr 1fr;min-height:610px;padding:6.5% 5.5%;gap:5%;align-items:center}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.eyebrow:before{content:'';display:inline-block;width:8px;height:8px;background:var(--orange);border-radius:50%;margin-right:10px}.hero h1,.page-head h1{font-size:clamp(55px,8vw,112px);line-height:.88;letter-spacing:-.075em;margin:28px 0}.hero h1 em,.page-head h1 em,h2 em{font-family:Georgia,serif;font-weight:400}.hero p,.page-head p{font-size:17px;line-height:1.7;max-width:470px;color:#4f4b43}.actions{display:flex;align-items:center;gap:25px;margin-top:32px}.textlink{font-size:12px;font-weight:800;text-transform:uppercase;border-bottom:1px solid;padding-bottom:6px}.hero-image{height:490px;position:relative;background:#d4c7ad;overflow:hidden}.hero-image img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(15%)}.stamp{position:absolute;right:7%;bottom:7%;background:var(--orange);padding:22px;font-weight:900;font-size:31px;line-height:.95;transform:rotate(-5deg)}.band{background:var(--ink);color:var(--cream);padding:30px 5.5%;display:flex;align-items:center;justify-content:space-between;gap:20px}.band strong{font-size:clamp(20px,3vw,36px);letter-spacing:-.04em}.band em{color:var(--orange);font-family:Georgia,serif;font-weight:400}.section{padding:90px 5.5%}.section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:38px}.section-head h2{font-size:clamp(38px,5.5vw,70px);line-height:.95;letter-spacing:-.06em;margin:16px 0 0}.section-head p{max-width:380px;line-height:1.7;color:#5d574e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.work img{width:100%;height:310px;object-fit:cover;display:block;background:#ddd}.work:nth-child(2){margin-top:55px}.work:nth-child(3){margin-top:110px}.work-meta{display:flex;justify-content:space-between;align-items:start;padding:15px 0;border-bottom:1px solid var(--line)}.work-meta small{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#756c60}.work-meta h3{font-size:20px;margin:8px 0}.services{background:#e8dfcc;display:grid;grid-template-columns:1fr 1fr;gap:8%;padding:80px 5.5%}.services h2{font-size:clamp(40px,5vw,68px);line-height:.95;letter-spacing:-.06em}.service-list a{display:flex;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line);font-size:20px;font-weight:700}.service-list span{color:var(--orange);font-size:12px}.cta-block{background:var(--orange);padding:85px 5.5%;text-align:center}.cta-block h2{font-size:clamp(44px,7vw,86px);letter-spacing:-.07em;line-height:.95;margin:20px 0 30px}.btn.dark{background:var(--ink);color:var(--cream)}.page-head{padding:90px 5.5% 55px;max-width:1100px}.page-head h1{font-size:clamp(54px,8vw,100px)}.page-content{padding:0 5.5% 90px}.about-row{display:grid;grid-template-columns:1fr 1fr;gap:8%;align-items:center}.about-row img{width:100%;height:430px;object-fit:cover}.about-row p{font-size:22px;line-height:1.6}.service-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.service-card{background:#e9e0ce;padding:30px;min-height:250px}.service-card b{color:var(--orange);font-size:12px}.service-card h3{font-size:25px}.service-card p{line-height:1.65;color:#5c554b}.contact{display:grid;grid-template-columns:1fr 1fr;gap:8%}.contact h2{font-size:52px;letter-spacing:-.06em}.contact p{line-height:1.7}.contact form{display:grid;gap:14px}.contact input,.contact textarea{width:100%;padding:15px;border:1px solid var(--line);background:transparent;font:inherit}.contact textarea{min-height:130px}.notice{font-size:13px;color:#6b4b20}.footer{background:var(--ink);color:var(--cream);padding:40px 5.5%;display:flex;justify-content:space-between;gap:25px;align-items:end}.footer p,.footer small{color:#bdb4a4}.footer-right{text-align:right;line-height:1.9;font-size:12px;color:#bdb4a4}.empty{padding:45px;background:#e9e0ce;line-height:1.7}.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.video-grid video{width:100%;background:#111}.admin-note{padding:25px;background:#e9e0ce;line-height:1.7;max-width:700px}.admin-note code{background:#ddd2bd;padding:3px 6px}
@media(max-width:900px){.header{flex-wrap:wrap}.menu{display:block}nav{display:none;order:3;width:100%;justify-content:flex-start}nav.open{display:flex}.header .cta{display:none}.hero{grid-template-columns:1fr;padding-top:55px}.hero-image{height:390px}.grid{grid-template-columns:repeat(2,1fr)}.work:nth-child(n){margin-top:0}.services{grid-template-columns:1fr}.service-cards{grid-template-columns:1fr 1fr}.section-head{display:block}.section-head p{margin-top:20px}}
@media(max-width:580px){.header{padding:15px 5%}.hero{padding:55px 5%}.hero h1{font-size:62px}.hero-image{height:330px}.band{align-items:flex-start;flex-direction:column}.section,.page-content{padding:65px 5%}.grid,.service-cards,.contact,.about-row,.video-grid{grid-template-columns:1fr}.work img{height:260px}.page-head{padding:65px 5% 35px}.page-head h1{font-size:57px}.footer{display:block}.footer-right{text-align:left;margin-top:25px}.actions{flex-wrap:wrap}}
</style></head>
<body>
<header class="header"><a class="brand" href="#/"><span class="brand-mark">F<span>+</span></span><span>FORM <i>&</i> FIRE<small>CREATIVE STUDIO</small></span></a><button class="menu" aria-label="Open menu" onclick="document.querySelector('nav').classList.toggle('open')">☰</button><nav id="nav"></nav><a class="cta" href="#/contact">Start a project ↗</a></header>
<div id="app"></div>
<script>
const navItems=[['Home','/'],['About','/about'],['Services','/services'],['Works','/works'],['Graphic Design','/graphic-design'],['Marketing','/marketing'],['Mural Art','/mural-art'],['Videos','/videos'],['Contact','/contact']];
const projects=[
 {title:'A New Visual Language',category:'Graphic Design',image:'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=1000',desc:'A bold visual identity built to stand apart.'},
 {title:'Culture in Motion',category:'Marketing',image:'https://images.unsplash.com/photo-1531058020387-3be344556be6?w=1000',desc:'A campaign connecting people, place and ideas.'},
 {title:'Walls That Speak',category:'Mural Art',image:'https://images.unsplash.com/photo-1549490349-8643362247b5?w=1000',desc:'Public art that brings colour and energy to a space.'},
 {title:'Colour Studies',category:'Graphic Design',image:'https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=1000',desc:'An exploration of colour, shape and typography.'},
 {title:'Street Stories',category:'Mural Art',image:'https://images.unsplash.com/photo-1561214115-f2f134cc4912?w=1000',desc:'Art inspired by the rhythm of the city.'},
 {title:'The Big Idea',category:'Marketing',image:'https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1000',desc:'Strategy and creative direction for a growing brand.'}
];
const imgAbout='https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=1200';
function cards(list){return `<div class="grid">${list.map((p,i)=>`<article class="work"><img src="${p.image}" alt="${p.title}" loading="lazy"><div class="work-meta"><div><small>${p.category}</small><h3>${p.title}</h3><p>${p.desc}</p></div><b>0${i+1} ↗</b></div></article>`).join('')}</div>`}
function pageHead(kicker,title,desc=''){return `<div class="page-head"><span class="eyebrow">${kicker}</span><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>`}
function render(){let path=location.hash.replace(/^#/, '')||'/';let html='';
if(path==='/') html=`<section class="hero"><div><span class="eyebrow">Independent creative studio · Addis Ababa</span><h1>Make it<br><em>matter.</em></h1><p>We build bold brands, thoughtful campaigns and art-filled spaces. Strategy, design and creativity — all under one roof.</p><div class="actions"><a class="btn" href="#/works">Explore our work ↗</a><a class="textlink" href="#/about">Get to know us ↗</a></div></div><div class="hero-image"><img src="${imgAbout}" alt="Creative studio workspace"><div class="stamp">MAKE<br>IT<br>MATTER.</div></div></section><div class="band"><span class="eyebrow">We make</span><strong>Brands <em>bold.</em> Ideas <em>visible.</em> Spaces <em>alive.</em></strong><span class="eyebrow">Design · Strategy · Art</span></div><section class="section"><div class="section-head"><div><span class="eyebrow">Selected projects / 2024—26</span><h2>Work that<br><em>moves people.</em></h2></div><p>A selection of visual identities, campaigns and art-led projects made with purpose.</p></div>${cards(projects.slice(0,3))}</section><section class="services"><div><span class="eyebrow">What we do</span><h2>Creative range.<br><em>One clear point of view.</em></h2></div><div class="service-list"><a href="#/graphic-design"><span>01</span> Graphic design ↗</a><a href="#/marketing"><span>02</span> Marketing & campaigns ↗</a><a href="#/mural-art"><span>03</span> Mural art ↗</a><a href="#/services"><span>04</span> Brand identity ↗</a></div></section><section class="cta-block"><span class="eyebrow">Have something in mind?</span><h2>Let's make<br><em>something matter.</em></h2><a class="btn dark" href="#/contact">Tell us about it ↗</a></section>`;
else if(path==='/about')html=`${pageHead('A little about us','Ideas with<br><em>character.</em>','We are a creative studio bringing design, marketing and mural art together to make work with meaning.') }<section class="page-content about-row"><img src="${imgAbout}" alt="Artists at work"><div><span class="eyebrow">Our point of view</span><h2>Make it meaningful.<br><em>Make it memorable.</em></h2><p>We listen closely, think strategically and make with intention — because every detail is a chance to make a connection. From the first sketch to the final wall, we believe good creative work should make people feel something.</p></div></section>`;
else if(path==='/services')html=`${pageHead('How we help','A creative toolkit<br><em>for ambitious ideas.</em>','From first thought to final finish, we shape the pieces that make your brand distinct.')}<section class="page-content service-cards"><article class="service-card"><b>01 / DESIGN</b><h3>Graphic design</h3><p>Visual identities, print, digital design, art direction and brand systems.</p></article><article class="service-card"><b>02 / STRATEGY</b><h3>Marketing</h3><p>Campaign concepts, content direction, creative strategy and storytelling.</p></article><article class="service-card"><b>03 / ART</b><h3>Mural art</h3><p>Custom murals, public art, environmental graphics and wall painting.</p></article></section>`;
else if(['/works','/graphic-design','/marketing','/mural-art'].includes(path)){let f=path==='/graphic-design'?'Graphic Design':path==='/marketing'?'Marketing':path==='/mural-art'?'Mural Art':'';let list=f?projects.filter(p=>p.category===f):projects;html=`${pageHead(f||'The portfolio','Selected work.<br><em>Real-world impact.</em>','A mix of identities, campaigns, visual experiments and spaces transformed through art.')}<section class="page-content">${cards(list)}</section>`;}
else if(path==='/videos')html=`${pageHead('Moving image','Ideas in<br><em>motion.</em>','Films, edits and moving-image stories from our creative projects.')}<section class="page-content"><div class="empty">Video gallery is ready for your videos. Add video files or hosted video links when you publish your portfolio.</div></section>`;
else if(path==='/contact')html=`${pageHead('Start a conversation',"Let's make<br><em>something matter.</em>",'Have a project, collaboration or idea? Tell us a little about it.')}<section class="page-content contact"><div><h2>Have a good one<br><em>in mind?</em></h2><p>We would love to hear what you are working on. Reach out and let’s make something meaningful.</p><p><b>Location</b><br>Addis Ababa, Ethiopia</p><p><b>Email</b><br><a href="mailto:hello@example.com">hello@example.com</a></p></div><form onsubmit="event.preventDefault();document.getElementById('formnotice').textContent='Your email app will open so you can send your message.';location.href='mailto:hello@example.com?subject='+encodeURIComponent(this.subject.value)+'&body='+encodeURIComponent(this.message.value+'\n\nFrom: '+this.name.value+' ('+this.email.value+')')"><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email address" required><input name="subject" placeholder="Project or subject"><textarea name="message" placeholder="Tell us about your idea..." required></textarea><button class="btn" type="submit">Send enquiry ↗</button><p class="notice" id="formnotice">This opens your email app to send the enquiry.</p></form></section>`;
else if(path==='/admin')html=`${pageHead('Private workspace','Admin<br><em>access.</em>','The admin dashboard requires a connected database and administrator account.')}<section class="page-content"><div class="admin-note"><b>Admin setup required</b><p>This standalone preview opens without installation. To enable secure admin login, editing, image/video uploads and saved contact messages, connect the Supabase project using the setup instructions in <code>README.md</code>.</p><a class="btn" href="#/">Back to website ↗</a></div></section>`;
else html=`${pageHead('404','Page not<br><em>found.</em>')}<section class="page-content"><a class="btn" href="#/">Back home ↗</a></section>`;
document.getElementById('app').innerHTML=html+`<footer class="footer"><div class="brand"><span class="brand-mark">F<span>+</span></span><span>FORM <i>&</i> FIRE<small>CREATIVE STUDIO</small></span></div><div class="footer-right">Addis Ababa, Ethiopia<br><a href="mailto:hello@example.com">hello@example.com</a><br>© ${new Date().getFullYear()} Form & Fire Studio</div></footer>`;
document.getElementById('nav').innerHTML=navItems.map(([n,p])=>`<a href="#${p}" class="${path===p?'active':''}">${n}</a>`).join('');document.querySelector('nav').classList.remove('open');window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script></body></html>
