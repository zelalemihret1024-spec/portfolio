name = "portfolio"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
# These paths go to worker.js first; everything else is served as a static file.
run_worker_first = ["/api/*", "/media/*"]

# Storage for your content, uploads and messages.
# Wrangler creates this KV namespace automatically on the first deploy.
[[kv_namespaces]]
binding = "CONTENT"
