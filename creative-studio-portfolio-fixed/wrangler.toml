name = "portfolio"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
# The worker runs first for every request; it handles /api/* and /media/*
# and passes everything else on to the static files (see worker.js).
run_worker_first = true

# Storage for your content, uploads and messages.
# Wrangler creates this KV namespace automatically on the first deploy.
[[kv_namespaces]]
binding = "CONTENT"
